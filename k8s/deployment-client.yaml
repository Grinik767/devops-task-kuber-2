apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: homework-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: localhost:5001/homework-client:hw2-v1
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: client-config
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 256Mi
